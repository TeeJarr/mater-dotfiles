# Tokyo Night "night" palette (folke/tokyonight.nvim)
# bg #1a1b26  bg_dark #16161e  bg_highlight #292e42  terminal_black #414868
# fg #c0caf5  comment #565f89  blue #7aa2f7  magenta #bb9af7  green #9ece6a  orange #ff9e64

set -g status on
set -g status-justify left
set -g status-interval 5
# Transparent bar so kitty's opacity/blur shows through like nvim
set -g status-style "bg=default,fg=#c0caf5"

set -g status-left-length 60
set -g status-right-length 80

# Session pill turns orange while the prefix is held
set -g status-left "#[fg=#7aa2f7,bg=default]#{?client_prefix,#[fg=#ff9e64],}#[bg=#7aa2f7,fg=#16161e,bold]#{?client_prefix,#[bg=#ff9e64],}  #S #[fg=#7aa2f7,bg=default,nobold]#{?client_prefix,#[fg=#ff9e64],} "

set -g status-right "#[fg=#292e42]#[bg=#292e42,fg=#bb9af7]  #{b:pane_current_path} #[fg=#292e42,bg=default] #[fg=#292e42]#[bg=#292e42,fg=#9ece6a] 󰃭 %m/%d/%Y #[fg=#292e42,bg=default] #[fg=#7aa2f7]#[bg=#7aa2f7,fg=#16161e,bold] %I:%M %p #[fg=#7aa2f7,bg=default,nobold]"

set -g window-status-separator " "
set -g window-status-format "#[fg=#292e42]#[bg=#292e42,fg=#565f89] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#292e42,bg=default]"
set -g window-status-current-format "#[fg=#bb9af7]#[bg=#bb9af7,fg=#16161e,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#bb9af7,bg=default,nobold]"
set -g window-status-activity-style "fg=#e0af68"
set -g window-status-bell-style "fg=#f7768e"

# Panes
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g display-panes-colour "#565f89"
set -g display-panes-active-colour "#7aa2f7"

# Messages, prompts and copy-mode selection
set -g message-style "bg=#292e42,fg=#7aa2f7"
set -g message-command-style "bg=#292e42,fg=#7aa2f7"
set -g mode-style "bg=#283457,fg=#c0caf5"
set -g clock-mode-colour "#7aa2f7"

# Popups (tmux-fzf)
set -g popup-border-style "fg=#7aa2f7"
set -g popup-border-lines rounded
