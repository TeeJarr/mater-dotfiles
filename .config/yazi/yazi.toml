# Only overrides live here; everything else comes from Yazi's built-in defaults, so new
# defaults (previewers, openers) arrive with upgrades. The old full copy is yazi.toml.bak.
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [ 1, 4, 3 ]
sort_dir_first = true
show_hidden    = true
show_symlink   = true
scrolloff      = 8

[preview]
max_width  = 1200
max_height = 1000

[open]
# Enter opens code and config files in $EDITOR (nvim), even when their MIME type isn't
# text/* (Yazi would hand those to macOS `open`). Images, PDFs and media keep the defaults.
prepend_rules = [
	{ mime = "application/{json,ndjson,toml,yaml,x-yaml,xml,x-shellscript,javascript,typescript,sql,x-sh}", use = [ "edit", "open", "reveal" ] },
	{ url = "*.{lua,ts,tsx,js,jsx,mjs,java,kt,kts,gradle,py,rb,go,rs,sh,zsh,fish,toml,yaml,yml,json,jsonc,md,conf,ini,env,properties,sql,xml,html,css,scss,vue,svelte}", use = [ "edit", "open", "reveal" ] },
	{ url = ".*", use = [ "edit", "open", "reveal" ] },
]
