# vim:fileencoding=utf-8:foldmethod=marker


allow_remote_control yes

[font]
font_family family "JetBrains Mono NL"
bold_font  					auto
italic_font  				auto
bold_italic_font  	auto
font_size 					20

[cursor]
cursor_trail 15
cursor_trail_start_threshold 1
shell_integration no-cursor
cursor_trail_decay 0.05 0.35
cursor_shape block
cursor_blink true

[window]
dynamic_background_opacity yes
macos_hide_titlebar yes
# active_border_color #ebdbb2
# inactive_border_color #ebdbb2
window_padding_width 10
window_margin_height 20
background_opacity 0.8
background_blur 40
placement_strategy top

[binds]
map super+u           set_background_opacity 1
map super+shift+u     set_background_opacity default


# BEGIN_KITTY_THEME
# 3024 Night
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
